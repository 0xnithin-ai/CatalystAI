version: '3.8'

services:
  backend:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      bash -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  streamlit:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./streamlit_app:/app
    ports:
      - "8501:8501"
    command: >
      bash -c "pip install streamlit requests pandas plotly streamlit-molstar && streamlit run app.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      - backend
