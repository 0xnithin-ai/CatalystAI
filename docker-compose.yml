version: '3.8'

services:
  backend:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      bash -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

  streamlit:
    image: python:3.10-slim
    working_dir: /app
    environment:
      - API_URL=http://backend:8000
    volumes:
      - ./streamlit_app:/app
    ports:
      - "8501:8501"
    command: >
      bash -c "pip install streamlit requests pandas plotly streamlit-molstar && streamlit run app.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
